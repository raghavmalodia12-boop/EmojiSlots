<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EmojiSlots Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

</head>
<body>
<header>
  <h1 class="mark">Emoji<span>Slots</span></h1>
  <div class="util">
    <button class="link" id="music" aria-pressed="true">Music on</button>
    <button class="link" id="sound" aria-pressed="true">Sound on</button>
    <button class="link" id="reset">Reset</button>
  </div>
</header>
<main>
  <section class="cabinet" aria-label="Slot machine">
    <div class="window" id="window">
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
      <div class="reel"><div class="strip"></div></div>
      <div class="payline" aria-hidden="true"><i></i></div>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite">Press Spin or the spacebar</p>
    <p class="note" id="note"></p>
    <div class="console">
      <div class="balance"><div class="label">Credits</div><output id="balance">1,000</output></div>
      <div class="bet">
        <div class="label">Bet</div>
        <div class="row">
          <button class="step" id="minus" aria-label="Lower bet">−</button>
          <output id="bet">25</output>
          <button class="step" id="plus" aria-label="Raise bet">+</button>
        </div>
      </div>
      <button class="spin" id="spin">Spin</button>
    </div>
    <div class="prog">
      <div><div class="lrow"><span id="lvl">Level 1</span><span id="xp"></span></div><div class="bar"><i id="xpbar"></i></div></div>
      <div><div class="lrow"><span id="goal"></span><span id="goalp"></span></div><div class="bar"><i id="gbar"></i></div></div>
    </div>
    <div class="foot">
      <button class="txt" id="paybtn">Paytable and records</button>
      <button class="auto" id="auto" aria-pressed="false"><span class="sw"></span>Auto-play</button>
    </div>
  </section>
</main>

<dialog id="pay" aria-labelledby="payh">
  <h2 id="payh">Paytable</h2>
  <table><thead><tr><th>Symbol</th><th>Pair</th><th>Three</th></tr></thead><tbody id="paybody"></tbody></table>
  <div class="rec"><span>Best win <b id="rbest">0</b></span><span>Spins played <b id="rspins">0</b></span></div>
  <button class="close" id="payclose">Close</button>
</dialog>
<canvas id="fx" aria-hidden="true"></canvas>
